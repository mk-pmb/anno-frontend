<div :id="name" role="tabpanel"
  :class="[
    'tab-pane',
    (topic ? 'tab-topic-' + topic : ''),
    paneCls,
  ].filter(Boolean)"
  :data-index="tabIndex"
  :data-name="name"
  :data-title="title"
  :data-topic="topic"
  :data-active="String(active)"
  :data-visible="String(visible)"
  v-show="visible"
  >
  <slot></slot>
</div>
